/* Receiving data (link or backup file): preview, match players, then merge. */
let incoming = null;
async function receiveFromText(str){
  const m = String(str||'').match(/#t=([A-Za-z0-9_-]+)/);
  if(!m){ ui.flash = 'Ce n’est pas un lien de partage Tablée.'; render(); return; }
  try{ openReceive(await unpackData(m[1])); }
  catch(e){ ui.flash = 'Ce lien de partage est abîmé ou incomplet.'; render(); }
}
function knownIds(){ const k = new Set(S.players.map(p=>p.id)); Object.values(S.games).forEach(g=>g.players.forEach(p=>k.add(p.id))); return k; }
function openReceive(d){
  if(!d || !d.games) throw new Error('format');
  const games = (Array.isArray(d.games) ? d.games : Object.values(d.games)).filter(g=>g && g.id && Array.isArray(g.players) && Array.isArray(g.rounds));
  const fresh = games.filter(g=>{ const loc = S.games[g.id]; return !loc || (g.updatedAt||0) > (loc.updatedAt||0); });
  const ip = {}; (d.players||[]).forEach(p=>{ if(p && p.id) ip[p.id] = p; });
  fresh.forEach(g=>g.players.forEach(p=>{ if(!ip[p.id]) ip[p.id] = p; }));
  const known = knownIds(); const map = {}; const ask = [];
  Object.values(ip).forEach(p=>{
    if(known.has(p.id)){ map[p.id] = p.id; return; }
    const al = S.alias && S.alias[p.id];
    if(al && S.players.some(x=>x.id===al)){ map[p.id] = al; return; }
    const same = S.players.find(x=>x.name.trim().toLowerCase()===String(p.name||'').trim().toLowerCase());
    map[p.id] = same ? same.id : 'new';
    if(fresh.some(g=>g.players.some(x=>x.id===p.id))) ask.push(p);
    else if(!same) map[p.id] = 'new'; // saved player from a backup file, no game yet
  });
  incoming = { games:fresh, total:games.length, players:ip, map, ask, err:'' };
  renderReceive();
}
function renderReceive(){
  const I = incoming; let h = `<div class="sheet-head"><button class="icon-btn" data-act="close" aria-label="Fermer">✕</button><h2>${I.games.length?'Parties reçues':'Rien de nouveau'}</h2></div>
    <div class="sheet-body"><div class="sheet-body-inner" style="gap:12px">`;
  if(!I.games.length){
    h += `<p class="hint">Tu as déjà ${I.total>1?'toutes ces parties':'cette partie'}, dans sa version la plus récente.</p></div></div>
      <div class="sheet-foot"><div class="sheet-foot-inner"><button class="btn" data-act="close">OK</button></div></div>`;
  } else {
    h += `<p class="hint" style="margin:0">${plural(I.games.length,'partie')} à ajouter${I.total>I.games.length?' ('+(I.total-I.games.length)+' déjà chez toi)':''}.</p>`;
    I.games.slice().sort((a,b)=>(b.finishedAt||b.updatedAt||0)-(a.finishedAt||a.updatedAt||0)).slice(0,6).forEach(g=>{
      const r = ranking(g); const done = g.status==='done';
      h += `<div class="card live-card"><div class="row"><i class="dot" style="--c:${(PRESETS[g.type]||PRESETS.libre).tile}"></i><b class="grow">${esc(gameTitle(g))}</b><span class="pill ${done?'done':''}">${done?fmtDate(g.finishedAt):'En cours'}</span></div>
        <div class="mini-scores">${r.map(x=>`<span><i class="dot" style="--c:${x.p.color}"></i>${esc(x.p.name)} <b class="num">${x.total}</b>${done&&x.rank===1?' <span class="crown">★</span>':''}</span>`).join('')}</div></div>`;
    });
    if(I.games.length>6) h += `<p class="hint" style="margin:0">… et ${I.games.length-6} autres.</p>`;
    if(I.ask.length){
      h += `<div class="eyebrow" style="margin-top:6px">Qui est qui ?</div><p class="hint" style="margin:0">Relie chaque joueur à quelqu’un de chez toi pour que ses stats se cumulent.</p>`;
      I.ask.forEach(p=>{
        h += `<label class="map-row"><span class="avatar" style="--c:${esc(p.color||'#888')}">${initial(p.name)}</span><b>${esc(p.name)}</b>
          <select class="input" data-map="${esc(p.id)}"><option value="new" ${I.map[p.id]==='new'?'selected':''}>Nouveau joueur « ${esc(p.name)} »</option>
          ${S.players.map(x=>`<option value="${x.id}" ${I.map[p.id]===x.id?'selected':''}>C’est ${esc(x.name)}</option>`).join('')}</select></label>`;
      });
    }
    if(I.err) h += `<p class="recv-err" role="alert">${esc(I.err)}</p>`;
    h += `</div></div><div class="sheet-foot"><div class="sheet-foot-inner"><button class="btn" data-act="recv-ok">Ajouter ${plural(I.games.length,'partie')}</button></div></div>`;
  }
  sheet.innerHTML = h; sheet.hidden = false; document.body.style.overflow='hidden';
}
function remapObj(o, f){ if(!o) return o; const n = {}; Object.keys(o).forEach(k=>{ n[f[k]||k] = o[k]; }); return n; }
function applyReceive(){
  const I = incoming; if(!I) return;
  const f = {}; Object.keys(I.map).forEach(pid=>{ f[pid] = I.map[pid]==='new' ? pid : I.map[pid]; });
  for(const g of I.games){ const ids = g.players.map(p=>f[p.id]||p.id);
    if(new Set(ids).size!==ids.length){ I.err = `Dans « ${gameTitle(g)} », deux joueurs sont reliés à la même personne.`; renderReceive(); return; } }
  S.alias = S.alias || {};
  Object.values(I.players).forEach(p=>{
    const to = f[p.id] || p.id;
    if(to!==p.id) S.alias[p.id] = to;
    else if(!S.players.some(x=>x.id===p.id) && I.map[p.id]==='new'){ const used = S.players.map(x=>x.color);
      S.players.push({ id:p.id, name:p.name||'Joueur', color: p.color && !used.includes(p.color) ? p.color : (COLORS.find(c=>!used.includes(c)) || p.color || COLORS[0]) }); }
  });
  I.games.forEach(src=>{
    const g = JSON.parse(JSON.stringify(src));
    g.players.forEach(p=>{ p.id = f[p.id]||p.id; const loc = S.players.find(x=>x.id===p.id); if(loc) p.name = loc.name; });
    g.rounds.forEach(r=>{ r.scores = remapObj(r.scores, f); if(r.marks) r.marks = remapObj(r.marks, f);
      if(r.raw){ r.raw.vals = remapObj(r.raw.vals, f); r.raw.neg = remapObj(r.raw.neg, f); if(r.raw.closer) r.raw.closer = f[r.raw.closer]||r.raw.closer; if(r.raw.winner) r.raw.winner = f[r.raw.winner]||r.raw.winner; } });
    g.updatedAt = Math.max(src.updatedAt||0, Date.now());
    S.games[g.id] = g;
    if(remote){ remote.col.doc('g_'+g.id).set(JSON.parse(JSON.stringify(g))).catch(()=>{}); }
  });
  lsWrite(); persistPlayers();
  const n = I.games.length; const one = n===1 ? I.games[0] : null;
  incoming = null; closeEntry();
  ui.flash = plural(n,'partie')+' ajoutée'+(n>1?'s':'')+' !';
  if(one){ ui.view='game'; ui.gameId=one.id; } else ui.view='home';
  render(); window.scrollTo(0,0);
}

    <div class="btn-row"><button class="btn" data-act="export">${ICON_SAVE.replace('<svg','<svg width="20" height="20" style="margin-right:6px"')}Créer une sauvegarde</button>
    <label class="btn ghost" for="import-file">Restaurer un fichier</label><input type="file" id="import-file" accept="application/json,.json" hidden></div>
  </div></section>`;
  h += `<section class="section"><div class="section-head"><h2>Partager avec un ami</h2></div><div class="card data-card">
    <p>Envoie un lien par message : en l’ouvrant, ton ami ajoute les parties à son propre Tablée. Les mêmes joueurs sont reconnus, donc vos stats se cumulent.</p>
    <p class="muted small">Pour une seule partie, utilise le bouton Partager en haut de la partie.</p>
    <div class="btn-row"><button class="btn" data-act="share-all" ${games.length?'':'disabled'}>Envoyer toutes mes parties</button></div>
  </div></section>`;
  h += `<section class="section"><div class="section-head"><h2>Tu as reçu un lien ?</h2></div>
    <form class="add-row" id="paste-form"><input id="paste-link" class="input" placeholder="Colle le lien ici" autocomplete="off" inputmode="url"><button class="btn" type="submit" style="min-height:46px;padding:0 16px">Ouvrir</button></form>
    <p class="muted small" style="margin:0">Utile sur iPhone quand Tablée est installé : le lien s’ouvre dans Safari, qui ne voit pas les parties de l’appli. Copie-le et colle-le ici.</p></section>`;
  h += `<p class="save-note">${plural(done,'partie terminée','parties terminées')} · ${Math.max(1,Math.round(JSON.stringify(S).length/1024))} Ko de données</p>`;
  app.innerHTML = h; dock.hidden = true;
}

/* ---------- Events ---------- */
document.addEventListener('click', e=>{
  const b = e.target.closest('[data-act]'); if(!b) return;
  const a = b.dataset.act; const g = S.games[ui.gameId];
  switch(a){
    case 'home': if(ui.view==='players' && ui.returnTo==='setup' && ui.setup){ ui.view='setup'; render(); break; } ui.flash=''; ui.view='home'; ui.confirmDelete=false; render(); window.scrollTo(0,0); break;
    case 'history': ui.view='history'; render(); window.scrollTo(0,0); break;
    case 'new': startSetup(b.dataset.type); break;
    case 'open': ui.view='game'; ui.gameId=b.dataset.id; ui.confirmDelete=false; render(); window.scrollTo(0,0); break;
    case 'demo': makeDemo(); break;
    case 'stats': ui.view='stats'; render(); window.scrollTo(0,0); break;
    case 'players': ui.returnTo = ui.view==='setup' ? 'setup' : 'home'; ui.view='players'; ui.editPlayer=ui.delPlayer=null; render(); window.scrollTo(0,0); break;
    case 'player': ui.playerFrom = ui.view; ui.playerId=b.dataset.id; ui.view='player'; render(); window.scrollTo(0,0); break;
    case 'back-player': ui.view = ui.playerFrom==='players'||ui.playerFrom==='stats' ? ui.playerFrom : 'home'; render(); window.scrollTo(0,0); break;
    case 'pedit': ui.editPlayer=b.dataset.id; ui.delPlayer=null; render(); break;
    case 'pdel': ui.delPlayer=b.dataset.id; ui.editPlayer=null; render(); break;
    case 'pdel-no': ui.delPlayer=null; render(); break;
    case 'pdel-yes': deletePlayer(b.dataset.id); ui.delPlayer=null; render(); break;
    case 'color': recolorPlayer(b.dataset.id, b.dataset.c); render(); break;
    case 'export': exportData(); break;
    case 'snooze': S.backupSnooze = Date.now()+7*864e5; lsWrite(); render(); break;
    case 'data': ui.flash=''; ui.view='data'; render(); window.scrollTo(0,0); break;
    case 'share-game': if(g) openShare('game'); break;
    case 'share-all': openShare('all'); break;
    case 'share-send': shareSend(); break;
    case 'share-copy': shareCopy(); break;
    case 'recv-ok': applyReceive(); break;
    case 'stat': ui.statFilter=b.dataset.f; render(); break;
    case 'pick': { const id=b.dataset.id; const s=ui.setup; const i=s.selected.indexOf(id); if(i>=0) s.selected.splice(i,1); else s.selected.push(id); render(); break; }
    case 'unpick': { const s=ui.setup; s.selected=s.selected.filter(x=>x!==b.dataset.id); render(); break; }
    case 'up': { const s=ui.setup; const i=+b.dataset.i; if(i>0){ [s.selected[i-1],s.selected[i]]=[s.selected[i],s.selected[i-1]]; render(); } break; }
    case 'start': startGame(); break;
    case 'round': openEntry(null); break;
    case 'edit': openEntry(+b.dataset.i); break;
    case 'close': incoming=null; shareCtx=null; closeEntry(); break;
    case 'save': saveRound(); break;
    case 'delround': if(g&&draft&&draft.edit!=null){ g.rounds.splice(draft.edit,1); persistGame(g); closeEntry(); render(); } break;
    case 'undo': if(g&&g.rounds.length){ g.rounds.pop(); persistGame(g); render(); } break;
    case 'finish': if(g){ g.status='done'; g.finishedAt=Date.now(); persistGame(g); render(); window.scrollTo({top:0,behavior:'smooth'}); } break;
    case 'reopen': if(g){ g.status='live'; delete g.finishedAt; persistGame(g); render(); } break;
    case 'replay': if(g){ g.players.forEach(p=>{ if(!S.players.find(x=>x.id===p.id)) S.players.push({...p}); }); persistPlayers(); startSetup(g.type, g); } break;
    case 'askdel': ui.confirmDelete=true; render(); break;
    case 'nodel': ui.confirmDelete=false; render(); break;
    case 'del': removeGame(ui.gameId); ui.confirmDelete=false; ui.view='home'; render(); window.scrollTo(0,0); break;
    case 'focus': if(draft && !draft.calc && !(g.mode==='winner'&&draft.winner===b.dataset.pid)) setActive(b.dataset.pid, true); break;
    case 'key': if(draft) pressKey(b.dataset.k); break;
    case 'calc': if(draft) openCalc(b.dataset.pid); break;
    case 'calc-add': if(draft&&draft.calc){ draft.calc.picks.push(+b.dataset.i); renderCalc(); } break;
    case 'calc-rm': if(draft&&draft.calc){ draft.calc.picks.splice(+b.dataset.n,1); renderCalc(); } break;
    case 'calc-cancel': if(draft&&draft.calc) closeCalc(); break;
    case 'calc-ok': if(draft&&draft.calc){ const pid=draft.calc.pid; setVal(pid, deckTotal(g.type, draft.calc.picks)); closeCalc(); nextPlayer(); } break;
    case 'chip': { const pid=b.dataset.pid; setVal(pid, readVal(pid)+(+b.dataset.v)); setActive(pid, true); draft.fresh=false; break; }
    case 'zero': { const pid=b.dataset.pid; setVal(pid, 0); setActive(pid, true); break; }
    case 'winner': { const pid=b.dataset.pid; draft.winner = draft.winner===pid?null:pid;
      sheet.querySelectorAll('[data-act="winner"]').forEach(x=>x.setAttribute('aria-pressed', x.dataset.pid===draft.winner));
      if(draft.winner){ draft.vals[pid]=''; draft.neg[pid]=false; }
      g.players.forEach(p=>updBox(p.id)); refreshPreview();
      if(draft.winner && draft.active===pid){ const ids=enabledPids(); if(ids.length) setActive(ids[0]); } else if(draft.active) setActive(draft.active, true);
      break; }
    case 'closer': { const pid=b.dataset.pid; draft.closer = draft.closer===pid?null:pid;
      sheet.querySelectorAll('[data-act="closer"]').forEach(x=>x.setAttribute('aria-pressed', x.dataset.pid===draft.closer)); refreshPreview(); break; }
  }
});

document.addEventListener('input', e=>{
  const t = e.target;
  if(t.id==='g-name' && ui.setup){ ui.setup.name=t.value; }
  else if(t.id==='new-player' && ui.setup){ ui.setup.newName=t.value; }
  else if(t.id==='g-target' && ui.setup){ const v=parseInt(t.value.replace(/[^0-9]/g,''),10); ui.setup.target = isNaN(v)?null:v; }
});
document.addEventListener('change', e=>{
  if(e.target.id==='import-file' && e.target.files && e.target.files[0]){ importData(e.target.files[0]); e.target.value=''; return; }
  if(e.target.dataset && e.target.dataset.map && incoming){ incoming.map[e.target.dataset.map] = e.target.value; incoming.err=''; return; }
  if(e.target.id==='g-low' && ui.setup){ ui.setup.low = e.target.checked; render(); }
});
document.addEventListener('keydown', e=>{
  const t = e.target;
  if(draft && !sheet.hidden && !draft.calc && !(t.tagName==='INPUT'||t.tagName==='SELECT'||t.tagName==='TEXTAREA') && !e.metaKey && !e.ctrlKey && !e.altKey){
    const map = {Backspace:'back', Delete:'back', Enter:'next', '-':'sign', '+':'p1'};
    const k = /^[0-9]$/.test(e.key) ? e.key : map[e.key];
    if(k){ e.preventDefault(); pressKey(k); return; }
  }
  if(e.key==='Escape' && !sheet.hidden){ if(draft && draft.calc) closeCalc(); else closeEntry(); }
});
document.addEventListener('submit', e=>{
  if(e.target.id==='paste-form'){ e.preventDefault(); receiveFromText(document.getElementById('paste-link').value); return; }
  if(e.target.id==='add-form-p'){ e.preventDefault(); const i=document.getElementById('new-player-p'); addPlayer(i.value||''); render(); const n=document.getElementById('new-player-p'); if(n) n.focus(); return; }
  if(e.target.id==='rename-form'){ e.preventDefault(); renamePlayer(e.target.dataset.id, document.getElementById('rename-input').value); ui.editPlayer=null; render(); return; }
  if(e.target.id==='add-form'){ e.preventDefault();
    const pl = addPlayer(ui.setup.newName||''); if(pl && !ui.setup.selected.includes(pl.id)) ui.setup.selected.push(pl.id);
    ui.setup.newName=''; render(); const inp=document.getElementById('new-player'); if(inp) inp.focus(); }
});

/* ---------- Keep the screen awake during a game ---------- */
let wake = null;
async function manageWakeLock(){
  const want = ui.view==='game' && S.games[ui.gameId] && S.games[ui.gameId].status==='live';
  try{
    if(want && !wake && navigator.wakeLock){ wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release',()=>{ wake=null; }); }
    else if(!want && wake){ await wake.release(); wake=null; }
  }catch(e){ wake=null; }
}
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') manageWakeLock(); });

/* ---------- Boot ---------- */
lsRead();
render();
connectRemote();
function checkHash(){
  const h = location.hash; if(!h.startsWith('#t=')) return;
  try{ history.replaceState(null, '', location.pathname+location.search); }catch(e){}
  receiveFromText(h);
}
window.addEventListener('hashchange', checkHash);
checkHash();
})();
</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').then(r=>r.update()).catch(()=>{}));
  // A new version took over: reload once, unless a round is being typed.
  let had = !!navigator.serviceWorker.controller, done = false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(!had){ had = true; return; } if(done) return; done = true;
    const busy = ()=>{ const s=document.getElementById('sheet'); return s && !s.hidden; };
    const go = ()=>{ if(busy()) setTimeout(go, 2000); else location.reload(); };
    go();
  });
}
try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
</script>
